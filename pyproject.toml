[project]
name = "modelshield"
version = "0.1.0"
description = "Policy-driven secure ML release control plane"
requires-python = ">=3.11"
dependencies = [
	"cryptography>=44.0.0,<47.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["policy", "quality", "security"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
