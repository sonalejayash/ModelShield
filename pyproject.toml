[project]
name = "modelshield"
version = "0.1.0"
description = "Policy-driven secure ML release control plane"
requires-python = ">=3.11"
dependencies = [
	"cryptography>=50.0.0,<51.0.0",
	"fastapi>=0.115.0,<1.0.0",
	"httpx2>=2.0.0,<3.0.0",
	"prometheus-client>=0.21.0,<1.0.0",
	"scikit-learn>=1.5.0,<2.0.0",
	"uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0.0,<9.0.0",
]
platform = [
	"mlflow>=2.20.0,<3.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "controller", "model", "policy", "quality", "security", "tracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
