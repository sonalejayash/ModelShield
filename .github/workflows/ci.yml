name: ModelShield CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify repository
        run: python scripts/verify_phase_0.py
      - name: Run tests
        run: python -m pytest -q

  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag modelshield:ci .
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: modelshield:ci
          format: cyclonedx-json
          output-file: modelshield-sbom.cdx.json
          artifact-name: modelshield-sbom
          upload-artifact: true
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: modelshield:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
      - name: Validate Terraform module
        working-directory: deploy/terraform
        run: terraform init -backend=false && terraform fmt -check && terraform validate

  kubernetes-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Conftest
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/open-policy-agent/conftest/releases/download/v0.69.0/conftest_0.69.0_Linux_x86_64.tar.gz \
            --output conftest.tar.gz
          tar -xzf conftest.tar.gz conftest
          chmod +x conftest
      - name: Validate Kubernetes security policy
        run: ./conftest test deploy/kubernetes/deployment.yaml --policy policies/rego